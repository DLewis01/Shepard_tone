<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Shepard Tone - Falling</title>

<style>

    body {
        margin: 0;
        background: #111;
        color: #ccc;
        font-family: sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        height: 100vh;
    }

    button {
        padding: 10px 24px;
        font-size: 16px;
        cursor: pointer;
    }

</style>

</head>


<body>

<button id="startButton">
    Start
</button>


<script>


/* =========================================================
   SHEPARD TONE PARAMETERS
   ========================================================= */


/*
   Number of oscillators.

   Each oscillator is one octave apart.
*/
const OSCILLATOR_COUNT = 10;
const WRAP_FADE_TIME = 0.02;

/*
   Lowest frequency of the Shepard cycle.

   Falling oscillators eventually reach this frequency,
   fade out, and then jump back to the top.
*/
const LOWEST_FREQUENCY = 20;


/*
   Highest frequency of the Shepard cycle.

   Falling oscillators jump back to this frequency after
   reaching the lowest frequency.
*/
const HIGHEST_FREQUENCY = 20000;


/*
   Starting frequency of the highest oscillator.

   The remaining oscillators are generated by dividing
   this value by powers of two.

   Example:

       10000
        5000
        2500
        1250
         625
         ...
*/
const HIGHEST_START_FREQUENCY = 10000;


/*
   Time required for an oscillator to FALL by ONE OCTAVE.

   Seconds.

   Smaller = faster fall
   Larger  = slower fall
*/
const OCTAVE_TIME = 8;


/*
   Master output level.
*/
const MASTER_VOLUME = 0.15;


/*
   Maximum level of an individual oscillator.
*/
const OSCILLATOR_VOLUME = 0.18;


/*
   Frequency at which the amplitude envelope reaches
   its maximum.

       0 = LOWEST_FREQUENCY
       1 = HIGHEST_FREQUENCY
*/
const ENVELOPE_CENTER = 0.5;


/*
   Width of the amplitude envelope.

   Larger = broader / flatter.
   Smaller = narrower / more pronounced.
*/
const ENVELOPE_WIDTH = 0.5;


/*
   Minimum gain.

   Normally zero.
*/
const ENVELOPE_MINIMUM = 0;


/*
   Safety margin around the wrap point.

   0.001 = 0.1%
*/
const WRAP_MARGIN = 0.001;


/*
   How frequently the scheduler runs.

   This does NOT control pitch speed.
*/
const SCHEDULER_INTERVAL = 0.05;


/*
   How far ahead the scheduler plans audio.

   Seconds.
*/
const SCHEDULE_AHEAD = 0.25;


/*
   Waveform.

   Normally "sine" for a classic Shepard tone.
*/
const WAVEFORM = "sine";


/*
   Optional compressor.
*/
const USE_COMPRESSOR = false;


/*
   Compressor settings.
*/
const COMPRESSOR_THRESHOLD = -24;
const COMPRESSOR_KNEE = 30;
const COMPRESSOR_RATIO = 12;
const COMPRESSOR_ATTACK = 0.003;
const COMPRESSOR_RELEASE = 0.25;


/* =========================================================
   END OF PARAMETERS
   ========================================================= */


let audioContext = null;

let masterGain = null;

let compressor = null;

let oscillators = [];

let running = false;

let schedulerTimer = null;


/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */


/*
   Convert frequency into a normalized position.

       LOWEST_FREQUENCY  -> 0
       HIGHEST_FREQUENCY -> 1
*/
function frequencyPosition(frequency) {

    const minLog =
        Math.log2(
            LOWEST_FREQUENCY
        );


    const maxLog =
        Math.log2(
            HIGHEST_FREQUENCY
        );


    return (
        (
            Math.log2(frequency) -
            minLog
        ) /
        (
            maxLog -
            minLog
        )
    );
}


/*
   Shepard amplitude envelope.

   Uses the same Witch-of-Agnesi curve as the working
   rising version.
*/
function amplitudeEnvelope(position) {

    const x =
        (
            position -
            ENVELOPE_CENTER
        ) /
        ENVELOPE_WIDTH;


    const envelope =
        1 /
        (
            1 +
            x * x
        );


    /*
       Normalize so the centre is 1.
    */

    const centerX =
        (
            ENVELOPE_CENTER -
            ENVELOPE_CENTER
        ) /
        ENVELOPE_WIDTH;


    const centerEnvelope =
        1 /
        (
            1 +
            centerX * centerX
        );


    let result =
        envelope /
        centerEnvelope;


    /*
       Outside the useful range = silence.
    */

    if (
        position < 0 ||
        position > 1
    ) {

        result = 0;
    }


    return Math.max(
        ENVELOPE_MINIMUM,
        Math.min(
            1,
            result
        )
    );
}


/*
   Calculate the multiplicative frequency change required
   to move ONE octave in OCTAVE_TIME seconds.
*/
function octaveMultiplierPerSecond() {

    return Math.pow(
        2,
        1 / OCTAVE_TIME
    );
}


/*
   Return the frequency after a given amount of time.

   For the FALLING version we divide rather than multiply.
*/
function frequencyAtTime(
    startFrequency,
    elapsedTime
) {

    const multiplier =
        octaveMultiplierPerSecond();


    return (
        startFrequency /
        Math.pow(
            multiplier,
            elapsedTime
        )
    );
}


/* =========================================================
   AUDIO INITIALISATION
   ========================================================= */

function initialiseAudio() {

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    /*
       Master gain.
    */

    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        MASTER_VOLUME;


    /*
       Optional compressor.
    */

    if (USE_COMPRESSOR) {

        compressor =
            audioContext.createDynamicsCompressor();


        compressor.threshold.value =
            COMPRESSOR_THRESHOLD;


        compressor.knee.value =
            COMPRESSOR_KNEE;


        compressor.ratio.value =
            COMPRESSOR_RATIO;


        compressor.attack.value =
            COMPRESSOR_ATTACK;


        compressor.release.value =
            COMPRESSOR_RELEASE;


        masterGain.connect(
            compressor
        );


        compressor.connect(
            audioContext.destination
        );

    } else {

        masterGain.connect(
            audioContext.destination
        );
    }


    /*
       Create all oscillators once.
    */

    for (
        let i = 0;
        i < OSCILLATOR_COUNT;
        i++
    ) {

        createOscillator(i);
    }
}


/* =========================================================
   OSCILLATOR CREATION
   ========================================================= */

function createOscillator(index) {
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = WAVEFORM;

    const startFrequency =
        HIGHEST_START_FREQUENCY / Math.pow(2, index);

    oscillator.frequency.value = startFrequency;
    gain.gain.value = 0;

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start();

    oscillators.push({
        oscillator,
        gain,
        startFrequency,

        // Maintain automation state ourselves.
        frequency: startFrequency,
        scheduledUntil: 0
    });
}



/* =========================================================
   SHEPARD OSCILLATOR SCHEDULER
   ========================================================= */

function scheduleOscillators() {

    if (!running) {
        return;
    }


    const now =
        audioContext.currentTime;


    const scheduleUntil =
        now +
        SCHEDULE_AHEAD;


    for (
        const voice of oscillators
    ) {

        scheduleVoice(
            voice,
            now,
            scheduleUntil
        );
    }
}


/* =========================================================
   FALLING VOICE SCHEDULER
   ========================================================= */

function scheduleVoice(voice, now, scheduleUntil) {
    if (voice.scheduledUntil >= scheduleUntil) {
        return;
    }

    let cursor = Math.max(
        now,
        voice.scheduledUntil
    );

    let frequency = voice.frequency;

    const octavesPerSecond =
        1 / OCTAVE_TIME;

    while (cursor < scheduleUntil) {
        /*
           If already at or below the lower limit,
           wrap immediately.
        */
        if (frequency <= LOWEST_FREQUENCY) {
            const wrapAt = cursor;

            voice.gain.gain.cancelScheduledValues(wrapAt);

            voice.gain.gain.setValueAtTime(
                0,
                wrapAt
            );

            voice.oscillator.frequency.cancelScheduledValues(
                wrapAt
            );

            voice.oscillator.frequency.setValueAtTime(
                HIGHEST_FREQUENCY,
                wrapAt
            );

            const highGain =
                amplitudeEnvelope(1) *
                OSCILLATOR_VOLUME;

            voice.gain.gain.linearRampToValueAtTime(
                highGain,
                wrapAt + WRAP_FADE_TIME
            );

            frequency =
                HIGHEST_FREQUENCY;

            cursor =
                wrapAt + WRAP_FADE_TIME;

            continue;
        }

        const secondsToBottom =
            Math.log2(
                frequency / LOWEST_FREQUENCY
            ) / octavesPerSecond;

        const wrapTime =
            cursor + Math.max(
                secondsToBottom,
                0
            );

        const segmentEnd =
            Math.min(
                wrapTime,
                scheduleUntil
            );

        if (segmentEnd <= cursor) {
            frequency =
                LOWEST_FREQUENCY;

            continue;
        }

        const duration =
            segmentEnd - cursor;

        const targetFrequency =
            Math.max(
                LOWEST_FREQUENCY,
                frequency *
                Math.pow(
                    2,
                    -duration * octavesPerSecond
                )
            );

        voice.oscillator.frequency.setValueAtTime(
            frequency,
            cursor
        );

        voice.oscillator.frequency
            .exponentialRampToValueAtTime(
                targetFrequency,
                segmentEnd
            );

        const startGain =
            amplitudeEnvelope(
                frequencyPosition(frequency)
            ) * OSCILLATOR_VOLUME;

        const endGain =
            amplitudeEnvelope(
                frequencyPosition(targetFrequency)
            ) * OSCILLATOR_VOLUME;

        voice.gain.gain.setValueAtTime(
            startGain,
            cursor
        );

        voice.gain.gain.linearRampToValueAtTime(
            endGain,
            segmentEnd
        );

        frequency =
            targetFrequency;

        cursor =
            segmentEnd;

        /*
           If the bottom was reached, the next loop
           performs the silent wrap.
        */
        if (cursor >= wrapTime) {
            frequency =
                LOWEST_FREQUENCY;
        }
    }

    voice.frequency =
        frequency;

    voice.scheduledUntil =
        Math.max(
            voice.scheduledUntil,
            scheduleUntil
        );
}





/* =========================================================
   START / STOP
   ========================================================= */

let audioGeneration = 0;


async function start() {

    if (running) {
        return;
    }


    /*
       Increment the generation.

       This invalidates anything left over from a previous
       audio session.
    */

    audioGeneration++;


    const thisGeneration =
        audioGeneration;


    /*
       Create a completely new audio graph.
    */

    initialiseAudio();


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();
    }


    /*
       Make sure Stop wasn't pressed while the context
       was being resumed.
    */

    if (
        thisGeneration !==
        audioGeneration
    ) {

        return;
    }


    running = true;


    /*
       Schedule the initial audio.
    */

    scheduleOscillators();


    /*
       JavaScript only maintains the scheduling window.
       It does NOT directly control the pitch.
    */

    schedulerTimer =
        setInterval(
            () => {

                /*
                   Ignore callbacks belonging to an old
                   audio generation.
                */

                if (
                    thisGeneration !==
                    audioGeneration
                ) {

                    return;
                }


                if (!running) {
                    return;
                }


                scheduleOscillators();

            },
            SCHEDULER_INTERVAL * 1000
        );


    startButton.textContent =
        "Stop";
}


async function stop() {

    if (
        !running &&
        !audioContext
    ) {

        return;
    }


    /*
       Immediately invalidate all previously scheduled
       JavaScript callbacks.
    */

    audioGeneration++;


    /*
       Stop the scheduler FIRST.
    */

    if (
        schedulerTimer !== null
    ) {

        clearInterval(
            schedulerTimer
        );

        schedulerTimer = null;
    }


    running = false;


    const contextToClose =
        audioContext;


    const oscillatorsToStop =
        oscillators;


    const masterToFade =
        masterGain;


    /*
       Prevent any newly created graph from accidentally
       being affected by this shutdown.
    */

    audioContext = null;

    masterGain = null;

    compressor = null;

    oscillators = [];


    if (!contextToClose) {

        startButton.textContent =
            "Start";

        return;
    }


    /*
       Very short fade to prevent a click when stopping.
    */

    try {

        const now =
            contextToClose.currentTime;


        masterToFade.gain
            .cancelScheduledValues(
                now
            );


        masterToFade.gain
            .setValueAtTime(
                masterToFade.gain.value,
                now
            );


        masterToFade.gain
            .linearRampToValueAtTime(
                0,
                now + 0.025
            );

    } catch (error) {

        /*
           If the context is already shutting down,
           there is nothing else to do.
        */
    }


    /*
       Stop EVERY oscillator.
    */

    for (
        const voice of oscillatorsToStop
    ) {

        try {

            voice.gain.disconnect();

        } catch (error) {

            // Already disconnected.

        }


        try {

            voice.oscillator.disconnect();

        } catch (error) {

            // Already disconnected.

        }


        try {

            voice.oscillator.stop(
                contextToClose.currentTime +
                0.03
            );

        } catch (error) {

            /*
               An oscillator can throw if it has already
               been stopped. That's harmless here.
            */
        }
    }


    /*
       Close the entire AudioContext after the tiny fade.
    */

    setTimeout(
        async () => {

            try {

                if (
                    contextToClose.state !==
                    "closed"
                ) {

                    await contextToClose.close();
                }

            } catch (error) {

                // Context may already be closed.

            }

        },
        50
    );


    startButton.textContent =
        "Start";
}


/* =========================================================
   USER INTERFACE
   ========================================================= */

const startButton =
    document.getElementById(
        "startButton"
    );


startButton.addEventListener(
    "click",
    () => {

        if (running) {

            stop();

        } else {

            start();
        }

    }
);


</script>

</body>

</html>
