<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shepard Tone</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: #ccc;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    button {
        padding: 10px 24px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>

<body>

<button id="startButton">Start</button>

<script>

/* =========================================================
   SHEPARD TONE PARAMETERS
   ========================================================= */

/*
   Number of oscillators.

   Each oscillator is one octave apart.
   More oscillators = smoother / denser Shepard tone.
*/
const OSCILLATOR_COUNT = 10;


/*
   Lowest frequency of the Shepard cycle.

   The lowest oscillator begins here.
*/
const LOWEST_FREQUENCY = 20;


/*
   Highest frequency of the Shepard cycle.

   When an oscillator reaches this frequency it is
   wrapped back to LOWEST_FREQUENCY.

   The amplitude envelope should have faded the oscillator
   out before this point.
*/
const HIGHEST_FREQUENCY = 20000;


/*
   Starting frequency of the highest oscillator.

   The remaining oscillators are generated by dividing
   this value by powers of two.

   Example with 10 oscillators:

       20000
       10000
        5000
        2500
        1250
         625
         ...
*/
const HIGHEST_START_FREQUENCY = 10000;


/*
   Time required for an oscillator to rise by ONE OCTAVE.

   Seconds.

   This is the main "speed" of the Shepard tone.

   Smaller = faster rise
   Larger  = slower rise
*/
const OCTAVE_TIME = 8;


/*
   Master output level.
*/
const MASTER_VOLUME = 0.15;


/*
   Maximum level of an individual oscillator.

   This is deliberately kept fairly low because multiple
   oscillators overlap.
*/
const OSCILLATOR_VOLUME = 0.18;


/*
   Frequency at which the amplitude envelope reaches
   its maximum.

   This is expressed as a position within the cycle:

       0 = LOWEST_FREQUENCY
       1 = HIGHEST_FREQUENCY

   0.5 therefore places the maximum in the middle.
*/
const ENVELOPE_CENTER = 0.5;


/*
   Width of the amplitude envelope.

   Larger values = broader / flatter envelope.
   Smaller values = narrower / more pronounced envelope.
*/
const ENVELOPE_WIDTH = 0.5;


/*
   Minimum gain.

   Normally zero.

   Keeping this at zero means oscillators become completely
   inaudible at the edges of their trajectory.
*/
const ENVELOPE_MINIMUM = 0;


/*
   How far inside the frequency range the oscillator should
   begin wrapping.

   A small safety margin ensures the oscillator has already
   reached essentially zero amplitude before its frequency
   jumps from the top back to the bottom.

   Expressed as a fraction of the frequency range.

   0.001 = 0.1%
*/
const WRAP_MARGIN = 0.001;


/*
   How frequently the Web Audio scheduler looks ahead.

   This is NOT an audio-rate timer.

   It simply schedules future AudioParam changes so that
   JavaScript timing jitter does not affect the sound.
*/
const SCHEDULER_INTERVAL = 0.05;


/*
   How far ahead the scheduler plans audio.

   Seconds.

   Larger values provide more protection against JavaScript
   timing delays.
*/
const SCHEDULE_AHEAD = 0.25;


/*
   Waveform.

   Available Web Audio oscillator types include:

       sine
       triangle
       square
       sawtooth

   A classic Shepard tone normally uses sine.
*/
const WAVEFORM = "sine";


/*
   Optional compressor.

   Set to true to use the compressor.
*/
const USE_COMPRESSOR = true;


/*
   Compressor settings.
*/
const COMPRESSOR_THRESHOLD = -24;
const COMPRESSOR_KNEE = 30;
const COMPRESSOR_RATIO = 12;
const COMPRESSOR_ATTACK = 0.003;
const COMPRESSOR_RELEASE = 0.25;


/* =========================================================
   END OF PARAMETERS
   ========================================================= */


let audioContext = null;

let masterGain = null;
let compressor = null;

let oscillators = [];

let running = false;
let schedulerTimer = null;


/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */


/*
   Convert a frequency into a normalized position within
   the Shepard frequency range.

   Because the frequency scale is logarithmic, this uses
   logarithms rather than a linear frequency relationship.

   LOWEST_FREQUENCY  -> 0
   HIGHEST_FREQUENCY -> 1
*/
function frequencyPosition(frequency) {

    const minLog = Math.log2(LOWEST_FREQUENCY);
    const maxLog = Math.log2(HIGHEST_FREQUENCY);

    return (
        (Math.log2(frequency) - minLog) /
        (maxLog - minLog)
    );
}


/*
   Shepard amplitude envelope.

   This uses a smooth bell-shaped curve.

   The curve is based on the Witch of Agnesi:

       1 / (1 + x²)

   It provides a smooth fade-in and fade-out without
   abrupt gain changes.
*/
function amplitudeEnvelope(position) {

    const x =
        (position - ENVELOPE_CENTER) /
        ENVELOPE_WIDTH;

    const envelope =
        1 / (1 + x * x);

    /*
       Normalize the envelope so that its maximum is 1.
    */

    const centerX =
        (ENVELOPE_CENTER - ENVELOPE_CENTER) /
        ENVELOPE_WIDTH;

    const centerEnvelope =
        1 / (1 + centerX * centerX);

    let result =
        envelope / centerEnvelope;

    /*
       Outside the useful region we can force the value
       to zero.

       This is mainly to guarantee that the oscillator is
       inaudible when wrapping.
    */

    if (position < 0 || position > 1) {
        result = 0;
    }

    return Math.max(
        ENVELOPE_MINIMUM,
        Math.min(1, result)
    );
}


/*
   Calculate the multiplicative frequency growth required
   for an oscillator to rise by one octave in OCTAVE_TIME.
*/
function octaveMultiplierPerSecond() {

    return Math.pow(
        2,
        1 / OCTAVE_TIME
    );
}


/*
   Return the frequency after a given amount of time.

   Frequency growth is exponential, which is essential
   because Shepard tones need equal musical intervals to
   occupy equal amounts of time.
*/
function frequencyAtTime(
    startFrequency,
    elapsedTime
) {

    const multiplier =
        octaveMultiplierPerSecond();

    return (
        startFrequency *
        Math.pow(multiplier, elapsedTime)
    );
}


/* =========================================================
   AUDIO INITIALISATION
   ========================================================= */

function initialiseAudio() {

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    /*
       Master gain.
    */

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        MASTER_VOLUME;


    /*
       Optional compressor.
    */

    if (USE_COMPRESSOR) {

        compressor =
            audioContext.createDynamicsCompressor();

        compressor.threshold.value =
            COMPRESSOR_THRESHOLD;

        compressor.knee.value =
            COMPRESSOR_KNEE;

        compressor.ratio.value =
            COMPRESSOR_RATIO;

        compressor.attack.value =
            COMPRESSOR_ATTACK;

        compressor.release.value =
            COMPRESSOR_RELEASE;

        masterGain.connect(compressor);

        compressor.connect(
            audioContext.destination
        );

    } else {

        masterGain.connect(
            audioContext.destination
        );
    }


    /*
       Create all oscillators once.

       They will remain alive for the entire duration
       of playback.
    */

    for (
        let i = 0;
        i < OSCILLATOR_COUNT;
        i++
    ) {

        createOscillator(i);
    }
}


/* =========================================================
   OSCILLATOR CREATION
   ========================================================= */

function createOscillator(index) {

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type =
        WAVEFORM;


    /*
       Start each oscillator one octave apart.

       The highest oscillator is HIGHEST_START_FREQUENCY.

       Every oscillator below it is divided by two.
    */

    const startFrequency =
        HIGHEST_START_FREQUENCY /
        Math.pow(2, index);


    oscillator.frequency.value =
        startFrequency;


    /*
       Start the oscillator completely silent.

       We will schedule its envelope separately.
    */

    gain.gain.value = 0;


    /*
       Permanent audio graph.

       This is performed ONLY ONCE.

       Unlike the original CodePen, these connections
       are never recreated by the scheduler.
    */

    oscillator.connect(gain);

    gain.connect(masterGain);


    oscillator.start();


    oscillators.push({

        oscillator,
        gain,

        startFrequency,

        /*
           Each oscillator starts at a different point in
           the frequency cycle because they are an octave
           apart.
        */

        phaseOffset: index
    });
}


/* =========================================================
   SHEPARD OSCILLATOR SCHEDULER
   ========================================================= */

function scheduleOscillators() {

    if (!running) {
        return;
    }


    const now =
        audioContext.currentTime;


    /*
       Schedule slightly ahead of the current audio time.

       This avoids relying on JavaScript timer accuracy.
    */

    const scheduleUntil =
        now + SCHEDULE_AHEAD;


    for (
        const voice of oscillators
    ) {

        scheduleVoice(
            voice,
            now,
            scheduleUntil
        );
    }
}


/*
   Schedule one oscillator's frequency and amplitude
   trajectory.

   The oscillator is treated as moving continuously through
   logarithmic frequency space.
*/

function scheduleVoice(
    voice,
    now,
    scheduleUntil
) {

    /*
       Determine where this oscillator currently is.

       Because the oscillators are one octave apart,
       each one begins at a different phase.
    */

    let currentFrequency =
        voice.oscillator.frequency.value;


    /*
       Protect against a frequency that has already passed
       the wrap point.
    */

    if (
        currentFrequency >=
        HIGHEST_FREQUENCY * (1 - WRAP_MARGIN)
    ) {

        currentFrequency =
            LOWEST_FREQUENCY;
    }


    /*
       Current normalized position.
    */

    let position =
        frequencyPosition(
            currentFrequency
        );


    /*
       Calculate how quickly logarithmic frequency changes.

       This is the number of octaves per second.
    */

    const octavesPerSecond =
        1 / OCTAVE_TIME;


    /*
       Rather than scheduling lots of tiny frequency jumps,
       use exponential AudioParam ramps.

       One complete octave takes OCTAVE_TIME seconds.
    */

    let cursor =
        now;


    let frequency =
        currentFrequency;


    /*
       The scheduler may need to schedule a wrap during
       this window.
    */

    while (
        cursor < scheduleUntil
    ) {

        const remainingToTop =
            Math.log2(
                HIGHEST_FREQUENCY /
                frequency
            ) /
            octavesPerSecond;


        const wrapTime =
            cursor +
            remainingToTop;


        const segmentEnd =
            Math.min(
                wrapTime,
                scheduleUntil
            );


        /*
           Schedule the frequency rise.
        */

        if (
            segmentEnd > cursor
        ) {

            const targetFrequency =
                frequency *
                Math.pow(
                    2,
                    (segmentEnd - cursor) *
                    octavesPerSecond
                );


            voice.oscillator.frequency
                .exponentialRampToValueAtTime(
                    Math.max(
                        0.001,
                        targetFrequency
                    ),
                    segmentEnd
                );


            /*
               Schedule the amplitude envelope.

               We sample the beginning and end of the
               segment. The actual audio parameter is ramped
               smoothly between them.
            */

            const startPosition =
                frequencyPosition(
                    frequency
                );

            const endPosition =
                frequencyPosition(
                    Math.min(
                        targetFrequency,
                        HIGHEST_FREQUENCY
                    )
                );


            const startGain =
                amplitudeEnvelope(
                    startPosition
                ) *
                OSCILLATOR_VOLUME;


            const endGain =
                amplitudeEnvelope(
                    endPosition
                ) *
                OSCILLATOR_VOLUME;


            voice.gain.gain
                .setValueAtTime(
                    startGain,
                    cursor
                );


            voice.gain.gain
                .linearRampToValueAtTime(
                    endGain,
                    segmentEnd
                );
        }


        /*
           If we have reached the top, wrap the frequency.

           Critically, the amplitude is already approaching
           zero at this point.
        */

        if (
            wrapTime <= scheduleUntil
        ) {

            const wrapAt =
                wrapTime;


            voice.gain.gain
                .setValueAtTime(
                    0,
                    wrapAt
                );


            voice.oscillator.frequency
                .setValueAtTime(
                    LOWEST_FREQUENCY,
                    wrapAt
                );


            /*
               Start the new cycle from the bottom.

               Because the gain is zero at the wrap point,
               the frequency discontinuity is inaudible.
            */

            const lowGain =
                amplitudeEnvelope(0) *
                OSCILLATOR_VOLUME;


            voice.gain.gain
                .setValueAtTime(
                    lowGain,
                    wrapAt
                );


            frequency =
                LOWEST_FREQUENCY;

            cursor =
                wrapAt;

        } else {

            frequency =
                Math.min(
                    HIGHEST_FREQUENCY,
                    frequency *
                    Math.pow(
                        2,
                        (segmentEnd - cursor) *
                        octavesPerSecond
                    )
                );

            cursor =
                segmentEnd;
        }
    }
}



/* =========================================================
   START / STOP
   ========================================================= */

let audioGeneration = 0;


async function start() {

    if (running) {
        return;
    }

    /*
       Increment the generation.

       This invalidates anything left over from a previous
       audio session.
    */
    audioGeneration++;

    const thisGeneration =
        audioGeneration;


    /*
       Create a completely new audio graph.
    */

    initialiseAudio();


    if (
        audioContext.state === "suspended"
    ) {
        await audioContext.resume();
    }


    /*
       Make sure Stop wasn't pressed while the context
       was being resumed.
    */

    if (
        thisGeneration !== audioGeneration
    ) {
        return;
    }


    running = true;


    /*
       Schedule the initial audio.
    */

    scheduleOscillators();


    /*
       JavaScript only maintains the scheduling window.
       It does NOT directly control the pitch.
    */

    schedulerTimer =
        setInterval(
            () => {

                /*
                   Ignore callbacks belonging to an old
                   audio generation.
                */

                if (
                    thisGeneration !==
                    audioGeneration
                ) {
                    return;
                }

                if (!running) {
                    return;
                }

                scheduleOscillators();

            },
            SCHEDULER_INTERVAL * 1000
        );


    startButton.textContent =
        "Stop";
}


async function stop() {

    if (!running && !audioContext) {
        return;
    }


    /*
       Immediately invalidate all previously scheduled
       JavaScript callbacks.
    */

    audioGeneration++;


    /*
       Stop the scheduler FIRST.
    */

    if (schedulerTimer !== null) {

        clearInterval(
            schedulerTimer
        );

        schedulerTimer = null;
    }


    running = false;


    const contextToClose =
        audioContext;


    const oscillatorsToStop =
        oscillators;


    const masterToFade =
        masterGain;


    /*
       Prevent any newly created graph from accidentally
       being affected by this shutdown.
    */

    audioContext = null;
    masterGain = null;
    compressor = null;
    oscillators = [];


    if (!contextToClose) {

        startButton.textContent =
            "Start";

        return;
    }


    /*
       Very short fade to prevent a click when stopping.
    */

    try {

        const now =
            contextToClose.currentTime;


        masterToFade.gain.cancelScheduledValues(
            now
        );


        masterToFade.gain.setValueAtTime(
            masterToFade.gain.value,
            now
        );


        masterToFade.gain.linearRampToValueAtTime(
            0,
            now + 0.025
        );

    } catch (error) {

        /*
           If the context is already shutting down,
           there is nothing else to do.
        */
    }


    /*
       Stop EVERY oscillator.

       This is the important part missing from the
       previous implementation.
    */

    for (
        const voice of oscillatorsToStop
    ) {

        try {

            voice.gain.disconnect();

        } catch (error) {
            // Already disconnected.
        }


        try {

            voice.oscillator.disconnect();

        } catch (error) {
            // Already disconnected.
        }


        try {

            voice.oscillator.stop(
                contextToClose.currentTime + 0.03
            );

        } catch (error) {

            /*
               An oscillator can throw if it has already
               been stopped. That's harmless here.
            */
        }
    }


    /*
       Close the entire AudioContext after the tiny fade.
    */

    setTimeout(
        async () => {

            try {

                if (
                    contextToClose.state !==
                    "closed"
                ) {

                    await contextToClose.close();
                }

            } catch (error) {
                // Context may already be closed.
            }

        },
        50
    );


    startButton.textContent =
        "Start";
}





/* =========================================================
   USER INTERFACE
   ========================================================= */

const startButton =
    document.getElementById(
        "startButton"
    );


startButton.addEventListener(
    "click",
    () => {

        if (running) {
            stop();
        } else {
            start();
        }

    }
);

</script>

</body>
</html>
